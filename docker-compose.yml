services:
  mysql:
    image: mysql:8.4
    container_name: nestera-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hotel_reservations
      MYSQL_USER: hotel_app
      MYSQL_PASSWORD: hotel_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - nestera_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nestera_mysql_data:
